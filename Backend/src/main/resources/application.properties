spring.application.name=backend

# ============================================================
# Server
# ============================================================

server.port=${SERVER_PORT:8080}

# HTTPS configuration
# Enable by providing SSL_KEY_STORE, SSL_KEY_STORE_PASSWORD
# and SSL_KEY_ALIAS environment variables.
server.ssl.enabled=${SERVER_SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SSL_KEY_ALIAS:}

# ============================================================
# PostgreSQL
# ============================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/byakushield_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# HikariCP
# ============================================================

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1800000}

# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================================
# JWT
# ============================================================

byakushield.jwt.secret=${JWT_SECRET}
byakushield.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================================
# Multipart limits
# ============================================================

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# ============================================================
# Logging
# ============================================================

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.com.byakushield.backend=DEBUG